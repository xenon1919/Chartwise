name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements-dev.txt

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt -r engine/requirements-dev.txt

      - name: Engine tests
        working-directory: engine
        run: python -m pytest -q

      - name: Install gateway dependencies
        run: npm ci --prefix server --no-audit --no-fund

      - name: Gateway syntax check
        run: for f in server/src/*.js; do node --check "$f"; done

      - name: Install web app dependencies
        run: npm ci --prefix client --no-audit --no-fund

      - name: Build web app
        run: npm run build --prefix client

      - name: End-to-end smoke test
        run: |
          (cd engine && python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 &)
          (cd server && node src/index.js &)
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:5050/api/health | grep -q '"engine":"ok"' && break
            sleep 1
          done
          curl -fs http://127.0.0.1:5050/api/health
          curl -fs http://127.0.0.1:5050/ | grep -q '<div id="root">'
          curl -fs -X POST http://127.0.0.1:5050/api/ask \
            -H 'content-type: application/json' \
            -d '{"datasetId":"ecommerce","question":"Top 5 products by revenue","engine":"demo"}' \
            | grep -q '"row_count":5'
          echo "Smoke test passed"

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chartwise:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: |
          docker run -d --name app -p 5050:5050 chartwise:ci
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:5050/api/health | grep -q '"engine":"ok"' && break
            sleep 2
          done
          curl -fs http://127.0.0.1:5050/api/health || (docker logs app; exit 1)
          curl -fs http://127.0.0.1:5050/ | grep -q '<div id="root">'
          docker rm -f app

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
